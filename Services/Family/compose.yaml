services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      - family-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      FAMILY_DOMAIN: ${FAMILY_DOMAIN:?Set FAMILY_DOMAIN to your API domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  family-data:
  caddy-data:
  caddy-config:
